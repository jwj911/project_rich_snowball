name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - 'python/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'python/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: futures
          POSTGRES_PASSWORD: futures123
          POSTGRES_DB: futures_community
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            ./python/requirements.txt
            ./python/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov

      - name: Verify direct dependencies are locked
        run: |
          python - <<'PY'
          from pathlib import Path
          from packaging.requirements import Requirement

          direct = {
              Requirement(line.strip()).name.lower().replace("_", "-")
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          locked = {
              Requirement(line.strip()).name.lower().replace("_", "-")
              for line in Path("requirements.lock").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.startswith((" ", "#"))
          }
          missing = sorted(direct - locked)
          if missing:
              raise SystemExit(f"Direct dependencies missing from requirements.lock: {missing}")
          print(f"Verified {len(direct)} direct dependencies are present in requirements.lock")
          PY

      - name: R7 release preflight contract gate (placeholder inputs only)
        # This read-only gate validates the CLI/report contract. Placeholder values are not production evidence.
        env:
          ENV: production
          DATABASE_URL: postgresql://ci-placeholder.invalid/r7_contract
          SECRET_KEY: ci-placeholder-secret-key-not-for-production-use-0001
          CORS_ORIGINS: https://ci-placeholder.invalid
          DATA_SOURCE: ci-contract-placeholder
          REDIS_URL: redis://ci-placeholder.invalid:6379/15
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_WINDOW_UTC: 2099-01-01T00:00:00Z/2099-01-01T01:00:00Z
          RELEASE_OWNER: ci-contract-placeholder
          ROLLBACK_OWNER: ci-contract-placeholder
          SSE_DEPLOYMENT_MODE: single
        run: |
          report_path="$RUNNER_TEMP/r7-release-preflight-contract.json"
          python scripts/release_preflight.py --report-path "$report_path"
          python - "$report_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "passed", report
          assert report["summary"]["failed"] == 0, report
          assert report["trace_id"], report
          print("R7 placeholder contract passed; this is not production release evidence.")
          PY

      - name: Run Alembic migrations
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          set -o pipefail
          if ! alembic upgrade head 2>&1 | tee alembic-migration.log; then
            summary="$(tail -n 30 alembic-migration.log | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=Alembic migration failed::${summary}"
            exit 1
          fi

      - name: Upload Alembic failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-alembic-migration-log
          path: python/alembic-migration.log
          if-no-files-found: ignore

      - name: R8 K-line storage and shadow partition gate
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          ENABLE_SCHEDULER: "0"
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          report_path="$RUNNER_TEMP/r8-kline-storage-preflight.json"
          python scripts/kline_storage_preflight.py --report-path "$report_path"
          python - "$report_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "not_required", report
          assert report["trace_id"], report
          assert report["database"]["dialect"] == "postgresql", report
          print("R8 read-only storage preflight passed.")
          PY
          pytest \
            tests/test_kline_storage.py \
            tests/test_kline_partitioning.py \
            tests/test_kline_rehearsal.py \
            tests/test_kline_partitioning_postgres.py \
            -q
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  resources = connection.execute(
                      text(
                          """
                          SELECT relname
                          FROM pg_class
                          WHERE relnamespace = to_regnamespace(current_schema())
                            AND relname LIKE 'kline_data_shadow_%'
                          ORDER BY relname
                          """
                      )
                  ).scalars().all()
              assert not resources, f"R8 shadow resources were not cleaned: {resources}"
              print("R8 shadow resource cleanup passed.")
          finally:
              engine.dispose()
          PY

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          ENABLE_SCHEDULER: "0"
          SSE_TEST_MODE: "1"
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          set -o pipefail
          if ! pytest tests -q --tb=short --cov=. --cov-report=term-missing --cov-fail-under=40 2>&1 | tee pytest-ci.log; then
            summary="$(tail -n 40 pytest-ci.log | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=PostgreSQL pytest failed::${summary}"
            exit 1
          fi

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-failure-log
          path: python/pytest-ci.log
          if-no-files-found: ignore

      - name: PostgreSQL API smoke
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          ENABLE_SCHEDULER: "0"
          ENV: development
          CORS_ORIGINS: http://127.0.0.1:3200
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          with TestClient(app) as client:
              ready = client.get("/health/ready")
              assert ready.status_code == 200, ready.text
              login = client.post(
                  "/api/auth/login",
                  data={"username": "trader001", "password": "password123"},
              )
              assert login.status_code == 200, login.text
              token = login.json()["access_token"]
              varieties = client.get(
                  "/api/varieties",
                  headers={"Authorization": f"Bearer {token}"},
              )
              assert varieties.status_code == 200, varieties.text
              assert varieties.json(), "PostgreSQL API smoke returned no varieties"
          PY

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Security audit with pip-audit
        # 基于 requirements.lock（精确版本）执行依赖漏洞扫描。
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --disable-pip
