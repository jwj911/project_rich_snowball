name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - 'python/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'python/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: futures
          POSTGRES_PASSWORD: futures123
          POSTGRES_DB: futures_community
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            ./python/requirements.txt
            ./python/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov

      - name: Verify direct dependencies are locked
        run: |
          python - <<'PY'
          from pathlib import Path
          from packaging.requirements import Requirement

          direct = {
              Requirement(line.strip()).name.lower().replace("_", "-")
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          locked = {
              Requirement(line.strip()).name.lower().replace("_", "-")
              for line in Path("requirements.lock").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.startswith((" ", "#"))
          }
          missing = sorted(direct - locked)
          if missing:
              raise SystemExit(f"Direct dependencies missing from requirements.lock: {missing}")
          print(f"Verified {len(direct)} direct dependencies are present in requirements.lock")
          PY

      - name: R7 release preflight contract gate (placeholder inputs only)
        # This read-only gate validates the CLI/report contract. Placeholder values are not production evidence.
        env:
          ENV: production
          DATABASE_URL: postgresql://ci-placeholder.invalid/r7_contract
          SECRET_KEY: ci-placeholder-secret-key-not-for-production-use-0001
          CORS_ORIGINS: https://ci-placeholder.invalid
          DATA_SOURCE: ci-contract-placeholder
          REDIS_URL: redis://ci-placeholder.invalid:6379/15
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_WINDOW_UTC: 2099-01-01T00:00:00Z/2099-01-01T01:00:00Z
          RELEASE_OWNER: ci-contract-placeholder
          ROLLBACK_OWNER: ci-contract-placeholder
          SSE_DEPLOYMENT_MODE: single
        run: |
          report_path="$RUNNER_TEMP/r7-release-preflight-contract.json"
          python scripts/release_preflight.py --report-path "$report_path"
          python - "$report_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "passed", report
          assert report["summary"]["failed"] == 0, report
          assert report["trace_id"], report
          print("R7 placeholder contract passed; this is not production release evidence.")
          PY

      - name: Run Alembic migrations
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          set -o pipefail
          if ! alembic upgrade head 2>&1 | tee alembic-migration.log; then
            summary="$(tail -n 30 alembic-migration.log | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=Alembic migration failed::${summary}"
            exit 1
          fi

      - name: Upload Alembic failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-alembic-migration-log
          path: python/alembic-migration.log
          if-no-files-found: ignore

      - name: R8 K-line storage and shadow partition gate
        # The 0 ms P99 is a contract placeholder for the empty CI database, not production performance evidence.
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          ENABLE_SCHEDULER: "0"
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          report_path="$RUNNER_TEMP/r8-kline-storage-preflight.json"
          set +e
          python scripts/kline_storage_preflight.py \
            --minute-query-p99-ms 0 \
            --report-path "$report_path"
          preflight_exit=$?
          set -e
          python - "$report_path" "$preflight_exit" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          exit_code = int(sys.argv[2])
          if exit_code != 0:
              error = report.get("error") or {}
              print(
                  "::error title=R8 storage preflight failed::"
                  f"status={report.get('status', 'unknown')}; "
                  f"error_type={error.get('error_type', 'unknown')}"
              )
              raise SystemExit(exit_code)
          assert report["status"] == "not_required", report
          assert report["trace_id"], report
          assert report["evidence"]["dialect"] == "postgresql", report
          print("R8 read-only storage preflight passed.")
          PY
          pytest \
            tests/test_kline_storage.py \
            tests/test_kline_partitioning.py \
            tests/test_kline_rehearsal.py \
            tests/test_kline_partitioning_postgres.py \
            -q
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  resources = connection.execute(
                      text(
                          """
                          SELECT relname
                          FROM pg_class
                          WHERE relnamespace = to_regnamespace(current_schema())
                            AND relname LIKE 'kline_data_shadow_%'
                          ORDER BY relname
                          """
                      )
                  ).scalars().all()
              assert not resources, f"R8 shadow resources were not cleaned: {resources}"
              print("R8 shadow resource cleanup passed.")
          finally:
              engine.dispose()
          PY

      - name: R9/R10 CSP reporting and evidence contract gate
        # Synthetic CI evidence only validates the contract; it is not production evidence or S2 admission.
        env:
          SECRET_KEY: ci-r10-csp-contract-secret-not-for-production-use-42
          ENABLE_SCHEDULER: "0"
          ENV: ci
          RELEASE_COMMIT: ${{ github.sha }}
          CSP_REPORT_SAMPLE_RATE: "1"
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          set -euo pipefail
          pytest \
            tests/test_csp_reports.py \
            tests/test_csp_reports_postgres.py \
            tests/test_csp_evidence.py \
            tests/test_csp_evidence_cli.py \
            tests/test_csp_evidence_postgres.py \
            -q

          evidence_dir="$(mktemp -d -- "$RUNNER_TEMP/r10-csp-evidence.XXXXXX")"
          cleanup_evidence() {
            rm -rf -- "$evidence_dir"
          }
          trap cleanup_evidence EXIT

          context_path="$evidence_dir/context.json"
          catalog_path="$evidence_dir/catalog.json"
          report_path="$evidence_dir/report.json"
          stdout_path="$evidence_dir/stdout.json"
          stderr_path="$evidence_dir/stderr.json"
          python - "$context_path" "$catalog_path" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          workflows = (
              "login",
              "refresh_recovery",
              "concurrent_401_singleflight",
              "logout",
              "sse_initial_connect",
              "sse_reconnect",
              "products",
              "product_detail",
              "workspace",
              "strategies",
              "agents",
              "bearer_write",
              "cookie_only_write_rejected",
              "csp_reporting_canary",
          )
          context = {
              "schema_version": 1,
              "evidence_source": "synthetic",
              "environment": "ci",
              "release": os.environ["RELEASE_COMMIT"].lower(),
              "window_start": "2099-01-01T00:00:00Z",
              "window_end": "2099-01-01T01:00:00Z",
              "sample_rate": 1,
              "complete_business_cycle": True,
              "workflows": {name: "passed" for name in workflows},
              "metrics": {
                  "business_http_requests": 1,
                  "csp_outcomes": {
                      "received": 1,
                      "accepted": 0,
                      "sampled": 0,
                      "rejected": 0,
                      "rate_limited": 0,
                      "persist_failed": 0,
                  },
              },
              "expected_document_origins": ["https://ci.invalid"],
              "trusted_source_origins": [],
          }
          Path(sys.argv[1]).write_text(
              json.dumps(context, ensure_ascii=True, separators=(",", ":")),
              encoding="utf-8",
          )
          Path(sys.argv[2]).write_text(
              json.dumps({"schema_version": 1, "entries": []}, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          chmod 600 "$context_path" "$catalog_path"

          set +e
          python scripts/csp_evidence_report.py \
            --context-path "$context_path" \
            --catalog-path "$catalog_path" \
            --report-path "$report_path" \
            >"$stdout_path" 2>"$stderr_path"
          evidence_exit=$?
          set -e
          if [ "$evidence_exit" -ne 1 ]; then
            echo "::error title=R10 synthetic evidence contract failed::unexpected exit code ${evidence_exit}"
            exit 1
          fi

          python - "$report_path" "$stdout_path" "$stderr_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              summary = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit("R10 synthetic report or summary could not be validated") from None
          if Path(sys.argv[3]).read_bytes():
              raise SystemExit("R10 synthetic CLI wrote unexpected stderr")
          status = report.get("status")
          if status != "insufficient_evidence" or status == "ready_for_review":
              raise SystemExit("R10 synthetic report returned an unexpected readiness status")
          if report.get("scope", {}).get("evidence_source") != "synthetic":
              raise SystemExit("R10 synthetic report returned an unexpected evidence source")
          if set(summary) != {"trace_id", "status", "counts"}:
              raise SystemExit("R10 synthetic CLI returned an unsafe summary shape")
          if (
              summary["trace_id"] != report.get("trace_id")
              or summary["status"] != status
              or summary["counts"] != report.get("counts")
          ):
              raise SystemExit("R10 synthetic CLI summary did not match the report")
          print(
              "R10 synthetic contract passed; this is not production evidence "
              "or S2 admission."
          )
          PY
          cleanup_evidence
          trap - EXIT

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          ENABLE_SCHEDULER: "0"
          SSE_TEST_MODE: "1"
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          set -o pipefail
          if ! pytest tests -q --tb=short --cov=. --cov-report=term-missing --cov-fail-under=40 2>&1 | tee pytest-ci.log; then
            summary="$(tail -n 40 pytest-ci.log | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=PostgreSQL pytest failed::${summary}"
            exit 1
          fi

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-failure-log
          path: python/pytest-ci.log
          if-no-files-found: ignore

      - name: PostgreSQL API smoke
        env:
          SECRET_KEY: test-secret-key-for-ci-local-development-42
          ENABLE_SCHEDULER: "0"
          ENV: development
          CORS_ORIGINS: http://127.0.0.1:3200
          DATABASE_URL: postgresql://futures:futures123@localhost:15432/futures_community
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          with TestClient(app) as client:
              ready = client.get("/health/ready")
              assert ready.status_code == 200, ready.text
              login = client.post(
                  "/api/auth/login",
                  data={"username": "trader001", "password": "password123"},
              )
              assert login.status_code == 200, login.text
              token = login.json()["access_token"]
              varieties = client.get(
                  "/api/varieties",
                  headers={"Authorization": f"Bearer {token}"},
              )
              assert varieties.status_code == 200, varieties.text
              assert varieties.json(), "PostgreSQL API smoke returned no varieties"
          PY

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Security audit with pip-audit
        # 基于 requirements.lock（精确版本）执行依赖漏洞扫描。
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --disable-pip
